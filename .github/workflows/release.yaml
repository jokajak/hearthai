name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
          echo "semver=${RAW#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/hearthmem
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.raw }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.raw }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./service
          # arm64 included because home clusters are often not x86.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Package and push the chart
        run: |
          VERSION="${{ steps.version.outputs.semver }}"
          # Chart and app move together; the tag is the single source of truth.
          helm package deploy/charts/hearthmem \
            --version "$VERSION" --app-version "$VERSION" --destination /tmp/chart
          helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          helm push "/tmp/chart/hearthmem-${VERSION}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.semver }}"
          OWNER="${{ github.repository_owner }}"
          {
            echo "### Published \`$VERSION\`"
            echo
            echo '```sh'
            echo "helm install hearthmem oci://ghcr.io/$OWNER/charts/hearthmem --version $VERSION"
            echo '```'
            echo
            echo "Image: \`ghcr.io/$OWNER/hearthmem:$VERSION\` (amd64, arm64)"
          } >> "$GITHUB_STEP_SUMMARY"
