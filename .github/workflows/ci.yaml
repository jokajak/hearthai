name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - name: Run tests
        working-directory: service
        # No global git identity is configured on purpose: the store sets a
        # repository-local one, and this proves it does not depend on ambient
        # config that will not exist in a container.
        run: python -m pytest tests -q

  image:
    name: build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./service
          push: false
          load: true
          tags: hearthmem:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          # A named volume, not a bind mount: docker seeds it from the image, so
          # /data keeps the uid 10001 ownership the Dockerfile sets. A host
          # directory would arrive owned by root and the non-root process could
          # not write to it.
          docker volume create hmdata >/dev/null
          docker run -d --name hm -p 8765:8765 -v hmdata:/data hearthmem:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/health

          echo "--- runs as non-root ---"
          test "$(docker exec hm id -u)" = "10001"

          echo "--- a full round trip through the container ---"
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8765/stores \
            -H 'Content-Type: application/json' \
            -d '{"purpose":"ci","author":"ci"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          curl -fsS -X POST http://127.0.0.1:8765/stores/_/entries \
            -H "X-Store-Token: $TOKEN" -H 'Content-Type: application/json' \
            -d '{"content":"a fact from ci","author":"ci"}' >/dev/null
          curl -fsS "http://127.0.0.1:8765/stores/_/entries?q=fact" \
            -H "X-Store-Token: $TOKEN" | grep -q 'a fact from ci'

          echo "--- SIGTERM drains rather than hanging until SIGKILL ---"
          START=$(date +%s)
          docker stop --time 30 hm >/dev/null
          ELAPSED=$(( $(date +%s) - START ))
          echo "stopped in ${ELAPSED}s"
          test "$ELAPSED" -lt 10
      - name: Data survives a restart
        run: |
          docker start hm >/dev/null
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1 && break || sleep 1
          done
          docker exec hm sh -c 'ls /data/stores | wc -l' | grep -qv '^0$'
          echo "store survived the restart"
          docker rm -f hm >/dev/null; docker volume rm hmdata >/dev/null

      - name: Container logs on failure
        if: failure()
        run: docker logs hm || true

  chart:
    name: lint chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: helm lint deploy/charts/hearthmem
      - name: Render every path that matters
        run: |
          helm template hm deploy/charts/hearthmem > /tmp/default.yaml
          helm template hm deploy/charts/hearthmem --set persistence.existingClaim=x > /dev/null
          helm template hm deploy/charts/hearthmem --set persistence.enabled=false > /dev/null
          helm template hm deploy/charts/hearthmem \
            --set ingress.enabled=true --set ingress.host=mem.example.com > /dev/null
      - name: Refuse to serve an unrevocable token without TLS
        run: |
          if helm template hm deploy/charts/hearthmem \
               --set ingress.enabled=true --set ingress.tls.enabled=false >/dev/null 2>&1; then
            echo "chart rendered an ingress without TLS; the guard is gone"
            exit 1
          fi
          echo "guard holds"
      - name: Assert the single-writer constraints survive
        run: |
          python3 - <<'PY'
          import yaml
          docs = [d for d in yaml.safe_load_all(open('/tmp/default.yaml')) if d]
          kinds = {d['kind']: d for d in docs}
          dep = kinds['Deployment']
          assert dep['spec']['replicas'] == 1, 'more than one writer corrupts the git store'
          assert dep['spec']['strategy']['type'] == 'Recreate', 'rolling update double-writes'
          assert kinds['PersistentVolumeClaim']['spec']['accessModes'] == ['ReadWriteOnce']
          c = dep['spec']['template']['spec']['containers'][0]
          assert c['securityContext']['readOnlyRootFilesystem'] is True
          assert c['securityContext']['capabilities']['drop'] == ['ALL']
          assert dep['spec']['template']['spec']['securityContext']['runAsNonRoot'] is True
          print('single-writer and hardening constraints hold')
          PY

      - uses: azure/setup-kubectl@v4
      - name: Validate against real Kubernetes schemas
        run: |
          curl -fsSL --retry 3 -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          helm template hm deploy/charts/hearthmem --set ingress.enabled=true \
            | /tmp/kubeconform -strict -summary -
