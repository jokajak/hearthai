  <head><title>About prompt injection</title></head>
  <body>
    <main>
      <h1>About prompt injection</h1>
      <p>A hostile page often contains the phrase "ignore previous instructions", which is why
      fetched content is handled as data rather than as instructions.</p>
      <p>The usual defences are isolating the fetch and inspecting the whole response before any of
      it reaches a model.</p>
    </main>
  </body>
</html>
