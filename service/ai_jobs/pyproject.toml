[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hearthai-ai-jobs"
version = "0.4.0"
description = "HearthAI isolated tool control plane"
requires-python = ">=3.11"
dependencies = [
  "kubernetes>=35,<38",
  "opentelemetry-sdk>=1.45,<1.46",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<1.46",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ai-jobs = "ai_jobs.server:main"
ai-jobs-worker = "ai_jobs.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
