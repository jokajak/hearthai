# Optional. Only needed if agents run outside the cluster.
#
# The store token is the only credential and it travels in the X-Store-Token
# header, so this must terminate TLS. Without it the token crosses the network
# in clear text and anyone who sees it has permanent access to that store.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hearthmem
  labels:
    app.kubernetes.io/name: hearthmem
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["hearthmem.example.internal"]
      secretName: hearthmem-tls
  rules:
    - host: hearthmem.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hearthmem
                port:
                  name: http
