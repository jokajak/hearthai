# kind's CNI is kindnet, not Cilium, so the CiliumNetworkPolicy kind does not exist there. The
# chart renders CiliumNetworkPolicy objects (control-plane ingress, per-profile egress), and
# Helm would refuse the release without the kind. This stub lets the API server ADMIT those
# objects with their fields unchecked. It does not enforce them: nothing in this cluster
# restricts any traffic, and the end-to-end test says so.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumnetworkpolicies.cilium.io
spec:
  group: cilium.io
  scope: Namespaced
  names:
    kind: CiliumNetworkPolicy
    listKind: CiliumNetworkPolicyList
    plural: ciliumnetworkpolicies
    singular: ciliumnetworkpolicy
    shortNames: [cnp]
  versions:
    - name: v2
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
