apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hearthmem.fullname" . }}
  labels:
    {{- include "hearthmem.labels" . | nindent 4 }}
spec:
  # Pinned. See the note at the bottom of values.yaml: a second writer against
  # the same git repository corrupts it.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate — the default would briefly run two pods
    # against one volume, which is the failure this is avoiding.
    type: Recreate
  selector:
    matchLabels:
      {{- include "hearthmem.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hearthmem.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--root", "/data"]
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: HEARTHMEM_HOST
              value: "0.0.0.0"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: data
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hearthmem.claimName" . }}
        {{- else }}
          # Nothing survives a restart. Useful for a smoke test, nothing else.
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
