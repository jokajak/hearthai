# Required site inputs. See deploy/examples/hearthai-values.yaml.
# Public origin, without a trailing slash; also determines the OIDC callback.
url: ""
timezone: UTC
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

# Secret values stay outside Helm release metadata. All Secrets are in the
# release namespace. Keys can be mapped to existing ExternalSecret outputs.
sessionSecret:
  name: ""
  key: WEBUI_SECRET_KEY
llm:
  # Only required when litellm.enabled=false. Otherwise wired internally.
  baseUrl: ""
  apiKeySecret:
    name: ""
    key: OPENAI_API_KEYS

# Image, model catalogue, env, probes, and init-db match home-ops at
# 6221eb6daa67f51c1aa84e3d43fe91486db7a4ee. No model/version substitutions.
litellm:
  enabled: true
  image:
    repository: ghcr.io/berriai/litellm-database
    tag: v1.99.1
    pullPolicy: IfNotPresent
  # Same envFrom contract as home-ops; see deploy/README.md for required keys.
  existingSecret: ""
  initDb:
    enabled: true
    image: ghcr.io/home-operations/postgres-init:18.6
  persistence:
    size: 64Mi
    storageClass: nfs-csi
    existingClaim: ""
  # Leave empty to use the byte-for-byte home-ops config bundled in files/.
  # A full replacement is available for operators with different endpoints.
  config: ""
  nodeSelector:
    kubernetes.io/arch: amd64
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  ingress:
    enabled: false
    host: ""
    className: internal
    annotations:
      hajimari.io/icon: mdi:router-network
    tlsSecretName: ""

auth:
  mode: oidc # oidc or local; anonymous access is not supported
  oidc:
    providerName: OpenID Connect
    discoveryUrl: ""
    scopes: openid email profile
    credentialsSecret:
      name: ""
      clientIdKey: OAUTH_CLIENT_ID
      clientSecretKey: OAUTH_CLIENT_SECRET
  local:
    # Bootstrap only: creates the first administrator on an empty database.
    # Existing accounts/passwords are not overwritten on upgrade.
    adminSecret:
      name: ""
      emailKey: WEBUI_ADMIN_EMAIL
      passwordKey: WEBUI_ADMIN_PASSWORD

openwebui:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: v0.11.3
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 10Gi
    storageClass: null # null = cluster default; "" = no StorageClass
    existingClaim: ""
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 4Gi
  # Upstream image defaults to root. Do not claim non-root compatibility.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  deploymentAnnotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: internal
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
  tls:
    # Empty uses the ingress controller's default certificate.
    secretName: ""

# Values for the bundled, independently usable memory chart. Kept internal by
# default; its existing persistence, image, and scheduling inputs are available.
hearthmem:
  image:
    tag: "0.1.0"
  ingress:
    enabled: false

# home-ops provides the CNPG operator. HearthAI owns only this single-server
# application database. Disable to keep DATABASE_URL from litellm.existingSecret.
postgres:
  enabled: true
  image: ghcr.io/cloudnative-pg/postgresql:16.0-10
  storage:
    size: 10Gi
    storageClass: openebs-hostpath
  resources:
    requests:
      cpu: 500m
    limits:
      memory: 4Gi

# Model names served only by a machine on the owner's network (an Ollama host
# behind the "<fullname>-local" gate Service, added separately). Each name gets
# exactly one LiteLLM entry with no cloud fallback; tests enforce that.
localInference:
  enabled: false
  # Address of the local Ollama host. Required when enabled; never commit a
  # real address, supply it from a substitution variable.
  upstreamUrl: ""
  # name is what callers request; ollamaModel is the tag Ollama serves;
  # contextWindow is the advertised max input tokens.
  models:
    - name: local-qwen
      ollamaModel: qwen3.6:35b-a3b
      contextWindow: 32768
  # The gate: a stock Caddy reverse proxy that is the only place the upstream
  # address exists (as an environment value on its Deployment).
  gate:
    image: docker.io/library/caddy:2.11.9
    # How long a connected upstream may stay silent before the first response
    # byte. Keep it generous: a cold 32k prompt was measured at about 50 s.
    responseHeaderTimeout: 180s
    networkPolicy:
      # Requires Cilium. Admits this release's LiteLLM and node probes only,
      # plus additionalIngress.
      enabled: true
      # Extra callers, e.g. a status-page prober in another namespace. Each
      # entry: {namespace: <ns>, matchLabels: {<label>: <value>}}.
      additionalIngress: []
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# Runtime pin and hardening copied from home-ops.
meridian:
  enabled: true
  image: ghcr.io/rynfar/meridian:1.68.0
  # Empty reuses MERIDIAN_API_KEY from litellm.existingSecret.
  # A separate Secret must carry the SAME MERIDIAN_API_KEY.
  existingSecret: ""
  persistence:
    size: 64Mi
    storageClass: nfs-csi
    existingClaim: ""
  networkPolicy:
    # Matches home-ops: requires Cilium; disables neither auth nor API key.
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 1Gi

# Isolated tool control plane (ai-jobs): model-callable tools that each run in one
# short-lived agent-sandbox pod. Off by default; enabling it needs the home-ops sandbox
# namespace first (see deploy/README.md, "ai-jobs"), because the default-deny policy that
# contains the sandbox pods is read from the live cluster.
aiJobs:
  enabled: false
  image:
    # One image for the control plane and for every sandbox worker.
    repository: ghcr.io/jokajak/ai-jobs
    # Defaults to .Chart.AppVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  # Namespace the sandboxes run in. It is created and locked down outside this chart
  # (Pod Security restricted, quota, default-deny); this chart only renders the
  # per-profile egress policies into it.
  sandboxNamespace: ai-jobs
  # Existing Secret in the release namespace. Required keys:
  #   <callerKeysKey>           JSON object {"<bearer key>": "<caller id>"}, keys >= 32 characters
  #   memory_recall_read_token  a hearthmem READ token (never the store's write token)
  # The control plane reads the token file at startup whether or not the recall profile is
  # enabled below, so the key must exist either way.
  existingSecret: ""
  callerKeysKey: caller-keys.json
  # Profiles. noop-v1 needs no network and renders nothing. A profile's egress policy is what
  # lets its sandbox reach anything at all: without it the namespace's default-deny holds.
  profiles:
    memoryRecall:
      # Renders the CiliumNetworkPolicy that lets memory-recall-v1 sandboxes reach DNS and this
      # release's hearthmem, and nothing else.
      enabled: false
  # Audit export (OpenTelemetry logs over OTLP/HTTP). Empty exports nothing; every audit
  # record is still written to stdout. Only the logs endpoint exists on purpose: the generic
  # OTEL_EXPORTER_OTLP_ENDPOINT would also start exporting traces.
  otel:
    serviceName: ai-jobs
    logsEndpoint: ""
  networkPolicy:
    # Requires Cilium. Control plane: ingress from this release's Open WebUI and node probes
    # only. Sandbox namespace: one egress policy per enabled profile.
    enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
